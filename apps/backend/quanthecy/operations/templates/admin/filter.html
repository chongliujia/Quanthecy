{% load i18n console %}
<details data-filter-title="{{ title }}" open>
  <summary>{% ct 'By' '按' %} {{ title|field_label }}</summary>
  <ul>{% for choice in choices %}<li{% if choice.selected %} class="selected"{% endif %}><a href="{{ choice.query_string|iriencode }}">{{ choice.display|field_label }}</a></li>{% endfor %}</ul>
</details>
