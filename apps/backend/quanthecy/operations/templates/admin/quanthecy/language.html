{% load console %}<form class="console-language" method="post" action="{% url 'platform_ops:language' %}" aria-label="{% ct 'Console language' '控制台语言' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" name="language" value="zh-hans" lang="zh-Hans" {% if console_is_zh %}class="selected" aria-pressed="true"{% else %}aria-pressed="false"{% endif %}>中文</button><button type="submit" name="language" value="en" lang="en" {% if not console_is_zh %}class="selected" aria-pressed="true"{% else %}aria-pressed="false"{% endif %}>EN</button></form>
