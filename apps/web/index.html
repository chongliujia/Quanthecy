<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101318" />
    <script>
      // Resolve before styles or React load to avoid flashing the opposite theme.
      (() => {
        let choice = 'dark';
        try { choice = localStorage.getItem('quanthecy.theme') ?? 'dark'; } catch {}
        const theme = choice === 'light' || choice === 'dark' ? choice
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101318' : '#f4f6f8';
      })();
    </script>
    <meta name="description" content="Your workspace for prediction-market research." />
    <title>Quanthecy — Research workspace</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
