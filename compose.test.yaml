# Standalone test stack: never merge with the application Compose files.
# No host ports, application volumes, collectors, model workers, or local secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quanthecy_tests
      POSTGRES_USER: quanthecy
      POSTGRES_PASSWORD: quanthecy-test-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U quanthecy -d quanthecy_tests']
      interval: 2s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: quanthecy_tests
      CLICKHOUSE_USER: quanthecy
      CLICKHOUSE_PASSWORD: quanthecy-test-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    tmpfs: [/var/lib/clickhouse, /var/log/clickhouse-server]
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user quanthecy --password quanthecy-test-only --query "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 30
    ulimits:
      nofile: {soft: 262144, hard: 262144}
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  python:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: postgres
      POSTGRES_DB: quanthecy_tests
      POSTGRES_USER: quanthecy
      POSTGRES_PASSWORD: quanthecy-test-only
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: quanthecy_tests
      CLICKHOUSE_USER: quanthecy
      CLICKHOUSE_PASSWORD: quanthecy-test-only
      QUANTHECY_TEST_CLICKHOUSE_URL: http://clickhouse:8123
      QUANTHECY_TEST_CLICKHOUSE_USER: quanthecy
      QUANTHECY_TEST_CLICKHOUSE_PASSWORD: quanthecy-test-only
      # Tests exercise these paths with mocked HTTP; no news worker is started.
      NEWS_FEEDS_ENABLED: 'true'
      NEWS_DOCUMENTS_ENABLED: 'true'
    command: [pytest, -q, -p, 'no:cacheprovider']
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}

networks:
  default:
    internal: true
